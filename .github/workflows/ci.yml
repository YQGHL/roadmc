name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .
